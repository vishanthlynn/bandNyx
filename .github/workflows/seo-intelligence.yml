name: Weekly search intelligence

on:
  schedule:
    - cron: "30 2 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-seo.txt

      - name: Install Search Console dependencies
        run: pip install -r requirements-seo.txt

      - name: Restore URL Inspection cache
        uses: actions/cache@v4
        with:
          path: |
            seo-private/inspection-cache.json
            seo-private/sitemap-state.json
          key: gsc-inspection-${{ github.run_id }}
          restore-keys: |
            gsc-inspection-

      - name: Collect Search Console data
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
        run: python -m scripts.search_intel collect

      - name: Build aggregate report
        run: python -m scripts.search_intel report

      - name: Upload private raw data
        uses: actions/upload-artifact@v4
        with:
          name: gsc-private-${{ github.run_id }}
          path: |
            seo-private/gsc-raw.json
            seo-private/inspection-cache.json
            seo-private/sitemap-state.json
          retention-days: 30

      - name: Open aggregate report PR
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.SEO_PR_TOKEN }}
          commit-message: "Update aggregate search intelligence"
          branch: automation/search-intelligence
          delete-branch: true
          title: "Update aggregate search intelligence"
          body: |
            Scheduled Search Console aggregate update.

            Raw page/query rows remain in the private Actions artifact and are not committed.
          add-paths: |
            seo/reports/summary.json
            seo/reports/*.md
